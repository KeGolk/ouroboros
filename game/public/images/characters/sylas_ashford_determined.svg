<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="400" height="480">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="grad-sylas_ashford-determined" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1008"/>
      <stop offset="100%" stop-color="#0A0A0A"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette-sylas_ashford-determined" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <!-- Parchment texture -->
    <filter id="texture-sylas_ashford-determined">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="120" fill="url(#grad-sylas_ashford-determined)"/>
  <rect width="100" height="120" fill="url(#vignette-sylas_ashford-determined)"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="96" height="116" fill="none" stroke="#B8860B" stroke-width="0.5" opacity="0.4" rx="1"/>
  <rect x="4" y="4" width="92" height="112" fill="none" stroke="#D4A76A" stroke-width="0.3" opacity="0.3" rx="1"/>

  <!-- Character silhouette -->
  <g filter="url(#texture-sylas_ashford-determined)" opacity="0.8">
    <path d="M50,14 C55,14 58,18 58,24 C58,30 55,34 50,35 C45,34 42,30 42,24 C42,18 45,14 50,14 Z
          M40,36 L32,40 L28,72 L38,74 L40,58 L45,64 L42,88 L48,88 L50,72 L52,88 L58,88 L55,64 L60,58 L62,74 L72,72 L68,40 L60,36 Z
          M32,40 L28,38 L26,44 L32,46 M68,40 L72,38 L74,44 L68,46" fill="#B8860B" stroke="#D4A76A" stroke-width="0.3"/>
  </g>

  <!-- Pose-specific decorations -->
  <line x1="35" y1="20" x2="42" y2="20" stroke="#D4A76A" stroke-width="1.5" opacity="0.7"/>
               <line x1="58" y1="20" x2="65" y2="20" stroke="#D4A76A" stroke-width="1.5" opacity="0.7"/>

  <!-- Faction accent line -->
  <line x1="20" y1="92" x2="80" y2="92" stroke="#D4A76A" stroke-width="0.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="50" y="100" text-anchor="middle" fill="#D4A76A" font-family="serif" font-size="5" font-weight="bold" opacity="0.9">Sylas Ashford</text>

  <!-- Pose label -->
  <text x="50" y="106" text-anchor="middle" fill="#B8860B" font-family="serif" font-size="3.5" font-style="italic" opacity="0.7">The Gambit</text>

  <!-- Title -->
  <text x="50" y="112" text-anchor="middle" fill="#D4A76A" font-family="serif" font-size="2.8" opacity="0.5">Guildmaster</text>
</svg>