<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="400" height="480">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="grad-elara_dawnwhisper-portrait" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#6B5B7B"/>
      <stop offset="100%" stop-color="#1A1025"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette-elara_dawnwhisper-portrait" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <!-- Parchment texture -->
    <filter id="texture-elara_dawnwhisper-portrait">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="120" fill="url(#grad-elara_dawnwhisper-portrait)"/>
  <rect width="100" height="120" fill="url(#vignette-elara_dawnwhisper-portrait)"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="96" height="116" fill="none" stroke="#8B6914" stroke-width="0.5" opacity="0.4" rx="1"/>
  <rect x="4" y="4" width="92" height="112" fill="none" stroke="#D4A76A" stroke-width="0.3" opacity="0.3" rx="1"/>

  <!-- Character silhouette -->
  <g filter="url(#texture-elara_dawnwhisper-portrait)" opacity="0.8">
    <path d="M50,14 C55,14 58,18 58,24 C58,30 55,34 50,35 C45,34 42,30 42,24 C42,18 45,14 50,14 Z
           M40,36 L32,44 L28,76 L40,74 L42,58 L48,88 L52,88 L58,58 L60,74 L72,76 L68,44 L60,36 Z
           M32,44 L22,52 L20,48 M68,44 L78,52 L80,48
           M48,50 L50,46 L52,50 L50,54 Z" fill="#8B6914" stroke="#D4A76A" stroke-width="0.3"/>
  </g>

  <!-- Pose-specific decorations -->
  

  <!-- Faction accent line -->
  <line x1="20" y1="92" x2="80" y2="92" stroke="#D4A76A" stroke-width="0.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="50" y="100" text-anchor="middle" fill="#D4A76A" font-family="serif" font-size="5" font-weight="bold" opacity="0.9">Elara Dawnwhisper</text>

  <!-- Pose label -->
  <text x="50" y="106" text-anchor="middle" fill="#8B6914" font-family="serif" font-size="3.5" font-style="italic" opacity="0.7">Default Portrait</text>

  <!-- Title -->
  <text x="50" y="112" text-anchor="middle" fill="#D4A76A" font-family="serif" font-size="2.8" opacity="0.5">The Unbound Seer</text>
</svg>