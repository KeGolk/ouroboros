<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="400" height="480">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="grad-brother_cedric-suspicious" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A6B2A"/>
      <stop offset="100%" stop-color="#0A1A08"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette-brother_cedric-suspicious" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <!-- Parchment texture -->
    <filter id="texture-brother_cedric-suspicious">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="120" fill="url(#grad-brother_cedric-suspicious)"/>
  <rect width="100" height="120" fill="url(#vignette-brother_cedric-suspicious)"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="96" height="116" fill="none" stroke="#6B5B3E" stroke-width="0.5" opacity="0.4" rx="1"/>
  <rect x="4" y="4" width="92" height="112" fill="none" stroke="#D4A76A" stroke-width="0.3" opacity="0.3" rx="1"/>

  <!-- Character silhouette -->
  <g filter="url(#texture-brother_cedric-suspicious)" opacity="0.8">
    <path d="M50,16 C55,16 58,20 58,25 C58,30 55,34 50,35 C45,34 42,30 42,25 C42,20 45,16 50,16 Z
         M38,36 L30,44 L26,80 L40,78 L42,60 L48,88 L52,88 L58,60 L60,78 L74,80 L70,44 L62,36 Z
         M30,44 L28,44 L26,50 L30,50 M70,44 L72,44 L74,50 L70,50" fill="#6B5B3E" stroke="#D4A76A" stroke-width="0.3"/>
  </g>

  <!-- Pose-specific decorations -->
  <line x1="38" y1="20" x2="44" y2="22" stroke="#D4A76A" stroke-width="1" opacity="0.6"/>
               <line x1="62" y1="20" x2="56" y2="22" stroke="#D4A76A" stroke-width="1" opacity="0.6"/>

  <!-- Faction accent line -->
  <line x1="20" y1="92" x2="80" y2="92" stroke="#D4A76A" stroke-width="0.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="50" y="100" text-anchor="middle" fill="#D4A76A" font-family="serif" font-size="5" font-weight="bold" opacity="0.9">Cedric of Thornwatch</text>

  <!-- Pose label -->
  <text x="50" y="106" text-anchor="middle" fill="#6B5B3E" font-family="serif" font-size="3.5" font-style="italic" opacity="0.7">Quiet Observation</text>

  <!-- Title -->
  <text x="50" y="112" text-anchor="middle" fill="#D4A76A" font-family="serif" font-size="2.8" opacity="0.5">Brother of the Green</text>
</svg>