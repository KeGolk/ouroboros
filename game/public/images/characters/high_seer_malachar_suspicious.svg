<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="400" height="480">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="grad-high_seer_malachar-suspicious" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#3D2B4F"/>
      <stop offset="100%" stop-color="#1A1025"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette-high_seer_malachar-suspicious" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <!-- Parchment texture -->
    <filter id="texture-high_seer_malachar-suspicious">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="120" fill="url(#grad-high_seer_malachar-suspicious)"/>
  <rect width="100" height="120" fill="url(#vignette-high_seer_malachar-suspicious)"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="96" height="116" fill="none" stroke="#6B5B7B" stroke-width="0.5" opacity="0.4" rx="1"/>
  <rect x="4" y="4" width="92" height="112" fill="none" stroke="#C0C0C0" stroke-width="0.3" opacity="0.3" rx="1"/>

  <!-- Character silhouette -->
  <g filter="url(#texture-high_seer_malachar-suspicious)" opacity="0.8">
    <path d="M50,14 C55,14 58,18 58,24 C58,30 55,34 50,35 C45,34 42,30 42,24 C42,18 45,14 50,14 Z
         M35,10 L50,5 L65,10 L60,35 L50,38 L40,35 Z
         M40,38 L28,48 L25,80 L40,78 L42,60 L48,88 L52,88 L58,60 L60,78 L75,80 L72,48 L60,38 Z" fill="#6B5B7B" stroke="#C0C0C0" stroke-width="0.3"/>
  </g>

  <!-- Pose-specific decorations -->
  <line x1="38" y1="20" x2="44" y2="22" stroke="#C0C0C0" stroke-width="1" opacity="0.6"/>
               <line x1="62" y1="20" x2="56" y2="22" stroke="#C0C0C0" stroke-width="1" opacity="0.6"/>

  <!-- Faction accent line -->
  <line x1="20" y1="92" x2="80" y2="92" stroke="#C0C0C0" stroke-width="0.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="50" y="100" text-anchor="middle" fill="#C0C0C0" font-family="serif" font-size="5" font-weight="bold" opacity="0.9">Malachar</text>

  <!-- Pose label -->
  <text x="50" y="106" text-anchor="middle" fill="#6B5B7B" font-family="serif" font-size="3.5" font-style="italic" opacity="0.7">Cryptic Gaze</text>

  <!-- Title -->
  <text x="50" y="112" text-anchor="middle" fill="#C0C0C0" font-family="serif" font-size="2.8" opacity="0.5">High Seer</text>
</svg>