<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="400" height="480">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="grad-nyx-combat" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#1A1008"/>
      <stop offset="100%" stop-color="#050505"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette-nyx-combat" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <!-- Parchment texture -->
    <filter id="texture-nyx-combat">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="120" fill="url(#grad-nyx-combat)"/>
  <rect width="100" height="120" fill="url(#vignette-nyx-combat)"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="96" height="116" fill="none" stroke="#B8860B" stroke-width="0.5" opacity="0.4" rx="1"/>
  <rect x="4" y="4" width="92" height="112" fill="none" stroke="#D4A76A" stroke-width="0.3" opacity="0.3" rx="1"/>

  <!-- Character silhouette -->
  <g filter="url(#texture-nyx-combat)" opacity="0.8">
    <path d="M50,16 C54,16 57,19 57,24 C57,29 54,33 50,34 C46,33 43,29 43,24 C43,19 46,16 50,16 Z
          M42,35 L36,40 L32,68 L40,68 L42,55 L46,60 L44,88 L48,88 L50,70 L52,88 L56,88 L54,60 L58,55 L60,68 L68,68 L64,40 L58,35 Z
          M36,40 L30,36 L28,42 L34,44" fill="#B8860B" stroke="#D4A76A" stroke-width="0.3"/>
  </g>

  <!-- Pose-specific decorations -->
  <line x1="72" y1="20" x2="82" y2="10" stroke="#D4A76A" stroke-width="2" opacity="0.8"/>
           <line x1="82" y1="10" x2="80" y2="15" stroke="#D4A76A" stroke-width="1.5" opacity="0.6"/>

  <!-- Faction accent line -->
  <line x1="20" y1="92" x2="80" y2="92" stroke="#D4A76A" stroke-width="0.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="50" y="100" text-anchor="middle" fill="#D4A76A" font-family="serif" font-size="5" font-weight="bold" opacity="0.9">Nyx</text>

  <!-- Pose label -->
  <text x="50" y="106" text-anchor="middle" fill="#B8860B" font-family="serif" font-size="3.5" font-style="italic" opacity="0.7">Shadow Strike</text>

  <!-- Title -->
  <text x="50" y="112" text-anchor="middle" fill="#D4A76A" font-family="serif" font-size="2.8" opacity="0.5">The Whisper</text>
</svg>