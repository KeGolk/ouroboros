<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="400" height="480">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="grad-aldric_vane-portrait" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A3C2A"/>
      <stop offset="100%" stop-color="#1A1008"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette-aldric_vane-portrait" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <!-- Parchment texture -->
    <filter id="texture-aldric_vane-portrait">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="120" fill="url(#grad-aldric_vane-portrait)"/>
  <rect width="100" height="120" fill="url(#vignette-aldric_vane-portrait)"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="96" height="116" fill="none" stroke="#6B5B3E" stroke-width="0.5" opacity="0.4" rx="1"/>
  <rect x="4" y="4" width="92" height="112" fill="none" stroke="#8B7D6B" stroke-width="0.3" opacity="0.3" rx="1"/>

  <!-- Character silhouette -->
  <g filter="url(#texture-aldric_vane-portrait)" opacity="0.8">
    <path d="M50,15 C55,15 58,18 58,23 C58,28 55,32 50,33 C45,32 42,28 42,23 C42,18 45,15 50,15 Z
           M42,35 L35,40 L30,65 L38,65 L40,55 L45,60 L42,85 L48,85 L50,70 L52,85 L58,85 L55,60 L60,55 L62,65 L70,65 L65,40 L58,35 Z" fill="#6B5B3E" stroke="#8B7D6B" stroke-width="0.3"/>
  </g>

  <!-- Pose-specific decorations -->
  

  <!-- Faction accent line -->
  <line x1="20" y1="92" x2="80" y2="92" stroke="#8B7D6B" stroke-width="0.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="50" y="100" text-anchor="middle" fill="#8B7D6B" font-family="serif" font-size="5" font-weight="bold" opacity="0.9">Aldric Vane</text>

  <!-- Pose label -->
  <text x="50" y="106" text-anchor="middle" fill="#6B5B3E" font-family="serif" font-size="3.5" font-style="italic" opacity="0.7">Default Portrait</text>

  <!-- Title -->
  <text x="50" y="112" text-anchor="middle" fill="#8B7D6B" font-family="serif" font-size="2.8" opacity="0.5">The Disgraced Knight</text>
</svg>