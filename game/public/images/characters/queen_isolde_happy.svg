<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 120" width="400" height="480">
  <defs>
    <!-- Background gradient -->
    <radialGradient id="grad-queen_isolde-happy" cx="50%" cy="40%" r="60%">
      <stop offset="0%" stop-color="#4A0000"/>
      <stop offset="100%" stop-color="#1A0F0A"/>
    </radialGradient>
    <!-- Vignette -->
    <radialGradient id="vignette-queen_isolde-happy" cx="50%" cy="50%" r="50%">
      <stop offset="60%" stop-color="transparent"/>
      <stop offset="100%" stop-color="rgba(0,0,0,0.6)"/>
    </radialGradient>
    <!-- Parchment texture -->
    <filter id="texture-queen_isolde-happy">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="4" result="noise"/>
      <feColorMatrix type="saturate" values="0" in="noise" result="grey"/>
      <feBlend in="SourceGraphic" in2="grey" mode="multiply"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="100" height="120" fill="url(#grad-queen_isolde-happy)"/>
  <rect width="100" height="120" fill="url(#vignette-queen_isolde-happy)"/>

  <!-- Decorative border -->
  <rect x="2" y="2" width="96" height="116" fill="none" stroke="#8B0000" stroke-width="0.5" opacity="0.4" rx="1"/>
  <rect x="4" y="4" width="92" height="112" fill="none" stroke="#C0C0C0" stroke-width="0.3" opacity="0.3" rx="1"/>

  <!-- Character silhouette -->
  <g filter="url(#texture-queen_isolde-happy)" opacity="0.8">
    <path d="M50,12 C56,12 60,16 60,22 C60,28 56,32 50,34 C44,32 40,28 40,22 C40,16 44,12 50,12 Z
          M38,10 L35,8 L40,12 M62,10 L65,8 L60,12
          M40,36 L32,42 L30,70 L38,72 L40,60 L45,65 L42,88 L48,88 L50,72 L52,88 L58,88 L55,65 L60,60 L62,72 L70,70 L68,42 L60,36 Z" fill="#8B0000" stroke="#C0C0C0" stroke-width="0.3"/>
  </g>

  <!-- Pose-specific decorations -->
  <path d="M42,28 Q50,32 58,28" fill="none" stroke="#C0C0C0" stroke-width="1.5" opacity="0.7"/>

  <!-- Faction accent line -->
  <line x1="20" y1="92" x2="80" y2="92" stroke="#C0C0C0" stroke-width="0.5" opacity="0.5"/>

  <!-- Character name -->
  <text x="50" y="100" text-anchor="middle" fill="#C0C0C0" font-family="serif" font-size="5" font-weight="bold" opacity="0.9">Isolde Blackthorn</text>

  <!-- Pose label -->
  <text x="50" y="106" text-anchor="middle" fill="#8B0000" font-family="serif" font-size="3.5" font-style="italic" opacity="0.7">Satisfied Smile</text>

  <!-- Title -->
  <text x="50" y="112" text-anchor="middle" fill="#C0C0C0" font-family="serif" font-size="2.8" opacity="0.5">Queen Regent</text>
</svg>